name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: slam-doctor diagnose examples/nav_oscillation.jsonl --symptom NAV_OSCILLATION
      - run: slam-doctor graph --symptom POSE_JUMP --format mermaid
