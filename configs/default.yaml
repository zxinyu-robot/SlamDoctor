defaults:
  frequency_tolerance: 0.25
  latency_warning_ms: 50
  latency_critical_ms: 200
  drop_warning_rate: 0.01
  drop_critical_rate: 0.05
  stale_seconds: 2
  frozen_window: 8
  frozen_variance: 0.000000001
  pose_jump_m: 1.5
  stationary_drift_m: 0.3
  imu_accel_limit: 160
  imu_gyro_limit: 35
  gnss_min_satellites: 6
  lidar_min_points: 1000
  camera_min_features: 30
  slam_min_inlier_ratio: 0.3
  slam_degeneracy_warning: 0.8
  path_max_age_ms: 200
  planning_max_time_ms: 500
  tracking_error_max_m: 0.5
  controller_cycle_max_ms: 100
  queue_depth_max: 5
  cpu_warning_percent: 90
  memory_warning_percent: 90
  temperature_warning_c: 85

sensors:
  imu_front:
    type: imu
    expected_frequency_hz: 200
    latency_warning_ms: 10
    latency_critical_ms: 30
  localization:
    type: localization
    expected_frequency_hz: 20
    pose_jump_m: 1
    stationary_drift_m: 0.2
